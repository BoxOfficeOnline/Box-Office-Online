name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  run-linters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Example for JS/TS projects:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      # - run: npm ci

      - uses: wearerequired/lint-action@v2
        with:
          eslint: true
          # prettier: true
